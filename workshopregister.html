<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Design Workshop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: rgb(248, 249, 250);
            color: rgb(33, 37, 41);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        div.box {
            border: 1px solid rgb(215, 215, 215);
            border-radius: 6px;
            margin-bottom: 18px;
            padding: 21px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        #topbox {
            background-color: rgb(42, 46, 51);
            color: white;
            padding: 36px;
            
        
            margin-bottom: 24px;
        }

        #box1{
            height: 60%;
        }
        #box2 {
            background-color: white;
            
            
            padding: 24px;
            height: 100%;
        }

        #box2 {
        
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            background-color: rgb(255, 193, 7);
            color: black;
            
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        dt {
            font-weight: 600;
            margin-bottom: 2px;
        }

        dd {
            margin-bottom: 14px;
        }
    </style>
</head>

<body>

    <div id="topbox">
        <div class="container">
            <span class="tag">Free workshop</span>
            <h1>Web Design Workshop</h1>
            <p style="font-size: 19px; font-weight: 300; margin-bottom: 0;">Build your first responsive webpage with HTML and Bootstrap.</p>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="box" id="box1">
                    <h2>Workshop details</h2>
                    <dl style="margin-bottom: 0;">
                        <dt>Day</dt>
                        <dd>Saturday</dd>
                        <dt>Location</dt>
                        <dd>School computer lab</dd>
                        <dt>What to bring</dt>
                        <dd style="margin-bottom: 0;">A laptop and charger</dd>
                    </dl>
                </div>
            </div>

            <div class="col-md-7">
                <div class="box" id="box2">
                    <h2 id="register-heading">Register for a session</h2>
                    <form action="#register-heading">
                        <div class="mb-3">
                            <label for="full-name" class="form-label">Full name</label>
                            <input id="full-name" class="form-control" type="text" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input id="email" class="form-control" type="email" required>
                        </div>

                        <div class="mb-4">
                            <p style="font-weight: 600; margin-bottom: 6px;">Choose a session</p>
                            <div class="form-check">
                                <input id="morning" class="form-check-input" type="radio" name="session" value="morning" required>
                                <label for="morning" class="form-check-label">Morning · 9:00–11:00 AM</label>
                            </div>
                            <div class="form-check">
                                <input id="afternoon" class="form-check-input" type="radio" name="session" value="afternoon" required>
                                <label for="afternoon" class="form-check-label">Afternoon · 2:00–4:00 PM</label>
                            </div>
                        </div>

                        <button class="btn btn-primary px-4" type="submit">Register</button>
                        <p style="font-size: 13px; color: rgb(108, 117, 125); margin-top: 12px; margin-bottom: 0;">Practice form. Entries are discarded.</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
